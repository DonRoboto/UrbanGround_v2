name: CPU tests and offline reproducibility
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Unit and integration tests (fake model only)
        run: python -m pytest -q
      - name: Check frozen reference files without GPU
        run: python scripts/verificar_reproduccion.py --reference-only
      - name: Offline audit using saved logits
        run: bash scripts/run_offline_audit.sh runs/ci_offline
